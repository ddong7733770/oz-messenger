<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오즈 메신저 - 마스터 관리 콘솔</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-100 app-height overflow-hidden flex flex-col font-sans">

    <!-- 상단 글로벌 네비게이션 바 -->
    <header class="bg-slate-900 text-white px-4 py-2.5 flex items-center justify-between z-20 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-teal-500 flex items-center justify-center font-bold text-sm shadow">
                오즈
            </div>
            <div>
                <h1 class="font-bold text-sm md:text-base tracking-tight flex items-center space-x-2">
                    <span>오즈 메신저 마스터 콘솔</span>
                    <span class="bg-teal-500/20 text-teal-300 text-[10px] px-2 py-0.5 rounded-full border border-teal-500/30">ADMIN</span>
                </h1>
                <p class="text-[11px] text-slate-400">skpark@iconix.co.kr &bull; 대화명: 오즈</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="refresh-rooms-btn" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition" title="목록 새로고침">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <button id="logout-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-red-600/80 text-xs text-slate-200 hover:text-white rounded-lg transition font-medium">
                로그아웃
            </button>
        </div>
    </header>

    <!-- 메인 대시보드 뷰 (좌측 리스트 + 중앙 대화창 + 우측 고객메모) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- ================= [좌측] 고객 대화방 목록 ================= -->
        <aside id="rooms-panel" class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-10 transition-transform duration-200">
            <!-- 검색창 -->
            <div class="p-3 border-b border-slate-100 space-y-2">
                <div class="relative">
                    <input 
                        type="text" 
                        id="room-search-input" 
                        placeholder="고객명 검색..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-100 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition"
                    >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3 top-2.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                
                <!-- 필터 탭 -->
                <div class="flex space-x-1 text-xs">
                    <button class="filter-tab flex-1 py-1.5 rounded-lg font-semibold bg-teal-50 text-teal-700" data-filter="all">전체</button>
                    <button class="filter-tab flex-1 py-1.5 rounded-lg font-semibold text-slate-500 hover:bg-slate-50" data-filter="waiting">대기중</button>
                    <button class="filter-tab flex-1 py-1.5 rounded-lg font-semibold text-slate-500 hover:bg-slate-50" data-filter="active">상담중</button>
                    <button class="filter-tab flex-1 py-1.5 rounded-lg font-semibold text-slate-500 hover:bg-slate-50" data-filter="closed">완료</button>
                </div>
            </div>

            <!-- 대화 목록 리스트 (스크롤) -->
            <div id="rooms-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <div class="p-8 text-center text-slate-400 text-xs">대화방 목록을 불러오는 중...</div>
            </div>
        </aside>

        <!-- ================= [중앙] 선택된 대화방 영역 ================= -->
        <main id="chat-section" class="flex-1 bg-slate-50 flex flex-col overflow-hidden relative">
            
            <!-- 대화방 미선택 상태 -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                <div class="w-16 h-16 bg-slate-200/60 rounded-full flex items-center justify-center text-slate-400 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                </div>
                <h3 class="text-base font-bold text-slate-700">대화방을 선택해주세요</h3>
                <p class="text-xs text-slate-400 mt-1 max-w-xs">좌측 목록에서 고객을 클릭하면 1:1 상담을 시작할 수 있습니다.</p>
            </div>

            <!-- 대화방 활성화 상태 -->
            <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                
                <!-- 방 상단 바 -->
                <div class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between z-10">
                    <div class="flex items-center space-x-3">
                        <!-- 모바일 목록 복귀 버튼 -->
                        <button id="back-to-rooms-btn" class="md:hidden p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 id="current-client-name" class="font-bold text-slate-800 text-sm md:text-base">고객명</h2>
                                <span id="current-client-badge" class="badge-waiting text-[10px] font-bold px-2 py-0.5 rounded-full">
                                    대기중
                                </span>
                            </div>
                            <p id="current-client-sub" class="text-[11px] text-slate-400">접속일시: 2026.10.02</p>
                        </div>
                    </div>

                    <!-- 우측 제어: 상태 변경 셀렉트 & 메모 패널 토글 -->
                    <div class="flex items-center space-x-2">
                        <select id="status-select" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50 font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-teal-500">
                            <option value="waiting">대기중</option>
                            <option value="active">상담중</option>
                            <option value="closed">상담완료</option>
                        </select>
                        <button id="toggle-memo-btn" class="p-1.5 text-slate-500 hover:text-teal-600 hover:bg-slate-100 rounded-lg transition" title="고객 메모">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 메시지 스크롤 영역 -->
                <div id="master-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- 메시지 동적 렌더링 -->
                </div>

                <!-- 빠른 답변 템플릿 바 -->
                <div class="bg-slate-100/90 border-t border-slate-200 px-3 py-1.5 flex items-center space-x-1.5 overflow-x-auto text-xs">
                    <span class="text-[11px] font-bold text-slate-500 flex-shrink-0">⚡ 빠른답변:</span>
                    <div id="canned-responses-bar" class="flex items-center space-x-1.5">
                        <!-- 동적으로 로딩 -->
                    </div>
                </div>

                <!-- 첨부 메뉴 팝업 -->
                <div id="master-attach-menu" class="hidden absolute bottom-20 left-4 bg-white rounded-2xl shadow-xl border border-slate-100 p-2 z-20 flex space-x-2">
                    <label for="master-image-input" class="flex flex-col items-center justify-center w-16 h-16 rounded-xl hover:bg-teal-50 cursor-pointer text-slate-600 hover:text-teal-600 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span class="text-[11px] font-semibold">사진 전송</span>
                        <input type="file" id="master-image-input" accept="image/*" class="hidden">
                    </label>

                    <label for="master-file-input" class="flex flex-col items-center justify-center w-16 h-16 rounded-xl hover:bg-blue-50 cursor-pointer text-slate-600 hover:text-blue-600 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                        </svg>
                        <span class="text-[11px] font-semibold">파일 첨부</span>
                        <input type="file" id="master-file-input" class="hidden">
                    </label>
                </div>

                <!-- 하단 입력 바 -->
                <div class="bg-white border-t border-slate-200 p-3 flex items-end space-x-2">
                    <button type="button" id="master-attach-toggle-btn" class="p-2.5 text-slate-500 hover:text-teal-600 hover:bg-slate-100 rounded-full transition flex-shrink-0" title="파일 첨부">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>

                    <div class="flex-1 bg-slate-100 rounded-2xl px-4 py-2 border border-slate-200 focus-within:border-teal-500 focus-within:bg-white transition flex items-center">
                        <textarea 
                            id="master-message-input" 
                            rows="1" 
                            placeholder="'오즈' 이름으로 답변 작성..." 
                            class="w-full bg-transparent resize-none focus:outline-none text-sm text-slate-800 max-h-28"
                        ></textarea>
                    </div>

                    <button 
                        type="button" 
                        id="master-send-btn" 
                        class="p-2.5 bg-teal-600 hover:bg-teal-700 active:scale-95 text-white rounded-full transition flex-shrink-0 shadow-md shadow-teal-600/30"
                        title="전송"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                    </button>
                </div>

            </div>
        </main>

        <!-- ================= [우측] 고객 메모장 (간이 CRM 사이드바) ================= -->
        <aside id="memo-panel" class="hidden w-72 lg:w-80 bg-white border-l border-slate-200 flex flex-col flex-shrink-0 p-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">고객 메모장 (CRM)</h3>
                <button id="close-memo-btn" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            </div>
            
            <div class="space-y-3 flex-1 flex flex-col">
                <div>
                    <label class="text-[11px] font-semibold text-slate-500">고객 대화명</label>
                    <p id="memo-client-name" class="text-sm font-bold text-slate-800">-</p>
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-500">최초 접속 일시</label>
                    <p id="memo-client-date" class="text-xs text-slate-600">-</p>
                </div>
                <div class="flex-1 flex flex-col pt-2">
                    <label for="memo-textarea" class="text-[11px] font-semibold text-slate-500 mb-1 flex items-center justify-between">
                        <span>상담 메모</span>
                        <span id="memo-save-status" class="text-[10px] text-teal-600 font-normal">자동 저장됨</span>
                    </label>
                    <textarea 
                        id="memo-textarea" 
                        placeholder="고객 연락처, 주문 상품, 특이사항 등을 기록하세요."
                        class="flex-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500 focus:bg-white resize-none"
                    ></textarea>
                </div>
            </div>
        </aside>

    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/master.js"></script>
</body>
</html>
