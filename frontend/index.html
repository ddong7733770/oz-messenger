<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오즈샵 - 고객 상담 센터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-100 via-teal-50 to-emerald-100 min-h-screen flex items-center justify-center p-4">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 p-6 md:p-8">
        
        <!-- 브랜드 헤더: 오즈샵 -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto mb-4 bg-teal-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-teal-600/30">
                <span class="font-extrabold text-2xl tracking-tight">오즈샵</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">오즈샵</h1>
            <p class="text-sm text-slate-500 mt-1 font-medium">온라인 샵 1:1 실시간 상담 & 판매 문의</p>
        </div>

        <!-- 기존 대화 이어하기 배너 (이전 기록 있는 경우 노출) -->
        <div id="resume-banner" class="hidden mb-6 p-4 bg-teal-50 border border-teal-200 rounded-2xl">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-xs text-teal-600 font-semibold uppercase tracking-wider">이전 상담 내역</div>
                    <div id="resume-name" class="text-sm font-bold text-slate-800">고객명</div>
                </div>
                <button id="resume-btn" class="px-3.5 py-1.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">
                    이어하기 &rarr;
                </button>
            </div>
        </div>

        <!-- 계정 생성 & 입장 폼 -->
        <form id="join-form" class="space-y-4" onsubmit="return false;">
            <div>
                <label for="nickname-input" class="block text-xs font-semibold text-slate-600 mb-2">
                    성함 또는 대화명 입력
                </label>
                <div class="relative">
                    <input 
                        type="text" 
                        id="nickname-input" 
                        placeholder="이름 또는 닉네임을 적어주세요" 
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition text-sm font-medium"
                        autocomplete="off"
                        required
                    >
                </div>
                <p id="helper-text" class="text-xs text-slate-400 mt-2 px-1">
                    * 담당자 '오즈샵'과 1:1로 안전하게 연결됩니다.
                </p>
            </div>

            <!-- 마스터 패스워드 입력창 (skpark@iconix.co.kr 입력 시 동적 노출) -->
            <div id="master-password-box" class="hidden pt-1">
                <label for="master-password" class="block text-xs font-semibold text-teal-700 mb-1 flex items-center justify-between">
                    <span>마스터 비밀번호</span>
                    <span class="text-xs font-normal text-slate-400">관리자 인증</span>
                </label>
                <input 
                    type="password" 
                    id="master-password" 
                    placeholder="비밀번호 4자리 입력" 
                    maxlength="10"
                    class="w-full px-4 py-3 bg-teal-50/50 border border-teal-300 rounded-2xl text-slate-800 placeholder-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono tracking-widest text-center text-base"
                >
            </div>

            <!-- 제출 버튼 -->
            <button 
                type="submit" 
                id="submit-btn" 
                class="w-full py-4 bg-teal-600 hover:bg-teal-700 active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg shadow-teal-600/25 transition flex items-center justify-center space-x-2 text-base cursor-pointer"
            >
                <span id="btn-text">프로필 생성 & 대화 시작</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </form>

        <!-- 하단 안내 -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400">
                별도의 앱 설치 없이 웹 링크로 바로 대화가 가능합니다.
            </p>
        </div>

    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/index.js"></script>
</body>
</html>
